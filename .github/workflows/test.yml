name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # 目标平台是 Windows：位置、非客户区、日志路径都按 Windows 行为验收
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 零运行时依赖，不需要 npm ci
      - run: npm test
